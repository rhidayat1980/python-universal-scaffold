version: '3'

tasks:
  default:
    desc: "List available maintainer tasks for the scaffold template"
    cmd: task --list

  test:render:api:
    desc: "Test render FastAPI service archetype"
    cmds:
      - rm -rf /tmp/test-api-service
      - uvx copier copy --defaults --data project_name="test-api-service" --data project_archetype="api-service" . /tmp/test-api-service
      - echo "Rendered api-service successfully to /tmp/test-api-service"

  test:render:analytics:
    desc: "Test render Data Analytics archetype"
    cmds:
      - rm -rf /tmp/test-analytics
      - uvx copier copy --defaults --data project_name="test-analytics" --data project_archetype="data-analytics" . /tmp/test-analytics
      - echo "Rendered data-analytics successfully to /tmp/test-analytics"

  test:render:ml:
    desc: "Test render AI/ML archetype"
    cmds:
      - rm -rf /tmp/test-ml
      - uvx copier copy --defaults --data project_name="test-ml" --data project_archetype="ai-ml" . /tmp/test-ml
      - echo "Rendered ai-ml successfully to /tmp/test-ml"

  test:render:worker:
    desc: "Test render Pipeline Worker archetype"
    cmds:
      - rm -rf /tmp/test-worker
      - uvx copier copy --defaults --data project_name="test-worker" --data project_archetype="pipeline-worker" . /tmp/test-worker
      - echo "Rendered pipeline-worker successfully to /tmp/test-worker"

  test:render:cli:
    desc: "Test render CLI Tool archetype"
    cmds:
      - rm -rf /tmp/test-cli
      - uvx copier copy --defaults --data project_name="test-cli" --data project_archetype="cli-tool" . /tmp/test-cli
      - echo "Rendered cli-tool successfully to /tmp/test-cli"

  test:render:library:
    desc: "Test render Library Package archetype"
    cmds:
      - rm -rf /tmp/test-library
      - uvx copier copy --defaults --data project_name="test-library" --data project_archetype="library-package" . /tmp/test-library
      - echo "Rendered library-package successfully to /tmp/test-library"

  test:render:all:
    desc: "Test rendering all 6 archetypes to verify Jinja syntax validity"
    cmds:
      - task: test:render:api
      - task: test:render:analytics
      - task: test:render:ml
      - task: test:render:worker
      - task: test:render:cli
      - task: test:render:library
      - echo "All 6 archetypes rendered successfully without errors!"

  clean:
    desc: "Clean up test rendered artifacts"
    cmds:
      - rm -rf /tmp/test-api-service /tmp/test-analytics /tmp/test-ml /tmp/test-worker /tmp/test-cli /tmp/test-library
