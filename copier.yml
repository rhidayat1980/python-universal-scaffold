# copier.yml - Interactive Prompt Configuration for Python Universal Scaffold
_min_copier_version: "9.0.0"
_subdirectory: "template"
_answers_file: ".copier-answers.yml"
_exclude:
  - "{% if project_archetype != 'data-analytics' %}data{% endif %}"
  - "{% if project_archetype != 'data-analytics' %}notebooks{% endif %}"
  - "{% if project_archetype != 'data-analytics' %}src/**/pipelines{% endif %}"
  - "{% if project_archetype != 'data-analytics' %}src/**/queries{% endif %}"
  - "{% if project_archetype != 'ai-ml' %}models{% endif %}"
  - "{% if project_archetype != 'ai-ml' %}datasets{% endif %}"
  - "{% if project_archetype != 'ai-ml' %}src/**/inference.py*{% endif %}"
  - "{% if project_archetype != 'ai-ml' %}src/**/training{% endif %}"
  - "{% if project_archetype != 'api-service' %}src/**/main.py*{% endif %}"
  - "{% if project_archetype != 'api-service' %}src/**/api{% endif %}"
  - "{% if project_archetype != 'api-service' %}src/**/schemas{% endif %}"
  - "{% if not include_database %}src/**/db{% endif %}"
  - "{% if not include_database %}src/**/models{% endif %}"
  - "{% if project_archetype != 'pipeline-worker' %}src/**/worker.py*{% endif %}"
  - "{% if project_archetype != 'pipeline-worker' %}src/**/tasks.py*{% endif %}"
  - "{% if project_archetype != 'cli-tool' %}src/**/cli.py*{% endif %}"
  - "{% if project_archetype != 'library-package' %}src/**/client.py*{% endif %}"
  - "{% if project_archetype != 'library-package' %}src/**/exceptions.py*{% endif %}"
  - "{% if project_archetype == 'library-package' or not include_container %}Dockerfile*{% endif %}"
  - "{% if project_archetype == 'library-package' or not include_container %}.dockerignore{% endif %}"

project_name:
  type: str
  default: "{{ _copier_conf.dst_path.name }}"
  when: false

package_name:
  type: str
  default: "{{ project_name | replace('-', '_') }}"
  when: false

project_archetype:
  type: str
  help: "Base architecture archetype for the project"
  choices:
    - "api-service"      # FastAPI REST / Async API Service
    - "data-analytics"  # Polars, DuckDB, Jupyter & Data Pipelines
    - "ai-ml"           # PyTorch, HuggingFace, Model Inference & Training
    - "pipeline-worker" # Async background worker & queue consumer
    - "cli-tool"        # Typer & Rich CLI Application
    - "library-package" # Reusable PyPI / internal distribution package
  default: "api-service"

python_version:
  type: str
  help: "Target Python runtime version"
  choices:
    - "3.12"
    - "3.13"
  default: "3.12"

include_container:
  type: bool
  help: "Include hardened multi-stage Dockerfile (non-root UID 10001, uv cache)?"
  default: true
  when: "{{ project_archetype != 'library-package' }}"

include_database:
  type: bool
  help: "Include async database layer (SQLAlchemy 2.0 + asyncpg + Alembic)?"
  default: false
  when: "{{ project_archetype in ['api-service', 'pipeline-worker'] }}"

compute_target:
  type: str
  help: "Hardware accelerator compute target for AI/ML"
  choices:
    - "cpu"
    - "cuda-12"
  default: "cpu"
  when: "{{ project_archetype == 'ai-ml' }}"

author_name:
  type: str
  help: "Author or maintainer full name"
  default: "Engineering Team"

author_email:
  type: str
  help: "Author or maintainer email address"
  default: "dev@company.local"
