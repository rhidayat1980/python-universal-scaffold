# copier.yml - Interactive Prompt Configuration for Python Universal Scaffold
_min_copier_version: "9.0.0"

project_name:
  type: str
  help: "Nama proyek (kebab-case, misal: auth-service, churn-model, etl-pipeline)"
  default: "python-service"
  validator: >-
    {% if not project_name | regex_search('^[a-z0-9]+(-[a-z0-9]+)*$') %}
    Nama proyek harus kebab-case (huruf kecil, angka, dipisahkan tanda minus).
    {% endif %}

package_name:
  type: str
  help: "Nama import package Python (snake_case)"
  default: "{{ project_name | replace('-', '_') }}"
  validator: >-
    {% if not package_name | regex_search('^[a-z_][a-z0-9_]*$') %}
    Nama package harus snake_case yang valid untuk identifier Python.
    {% endif %}

project_archetype:
  type: str
  help: "Arketipe arsitektur dasar proyek"
  choices:
    - "api-service"      # FastAPI REST / Async API Service
    - "data-analytics"  # Polars, DuckDB, Jupyter & Data Pipelines
    - "ai-ml"           # PyTorch, HuggingFace, Model Inference & Training
    - "pipeline-worker" # Async background worker & queue consumer
    - "cli-tool"        # Typer & Rich CLI Application
    - "library-package" # Reusable PyPI / internal distribution package
  default: "api-service"

python_version:
  type: str
  help: "Target versi runtime Python"
  choices:
    - "3.12"
    - "3.13"
  default: "3.12"

include_container:
  type: bool
  help: "Sertakan Dockerfile multi-stage hardened (non-root UID 10001, uv cache)?"
  default: true
  when: "{{ project_archetype != 'library-package' }}"

include_database:
  type: bool
  help: "Sertakan layer database async (SQLAlchemy 2.0 + asyncpg + Alembic)?"
  default: false
  when: "{{ project_archetype in ['api-service', 'pipeline-worker'] }}"

compute_target:
  type: str
  help: "Target komputasi akselerator untuk AI/ML"
  choices:
    - "cpu"
    - "cuda-12"
  default: "cpu"
  when: "{{ project_archetype == 'ai-ml' }}"

author_name:
  type: str
  help: "Nama Author / Maintainer"
  default: "Engineering Team"

author_email:
  type: str
  help: "Email Author / Maintainer"
  default: "dev@company.local"
